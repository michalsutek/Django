<h1>Prevod teploty</h1>
<form method="post">
  {% csrf_token %}
  <input type="number" step="any" name="hodnota" required>
  <select name="smer">
    <option value="c2f">°C → °F</option>
    <option value="f2c">°F → °C</option>
  </select>
  <button>Previesť</button>
</form>

{% if vysledok is not None %}
  <p>Výsledok: {{ vysledok|floatformat:1 }} {{ jednotka }}</p>
{% endif %}
